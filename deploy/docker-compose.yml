# ============================================================================
# SVL PYTHON OS — DEBIAN 13 TRIXIE PRODUCTION STACK (DOCKER COMPOSE)
# Includes:
# 1. svl-python-backend (FastAPI + SVLSystemKernel + 5 Spherical Agent Workers)
# 2. ollama (Local LLM & Native Vision Engine with GPU passthrough if available)
# 3. ollama-model-init (pulls the configured OLLAMA_PREFERRED_MODEL)
# 4. open-webui (Official Open WebUI connected to Ollama + SVL Python OS Pipelines)
# ============================================================================

x-agent-desktop: &agent-desktop
  profiles: ["desktops"]
  build:
    context: ./agent-desktop
  restart: unless-stopped
  init: true
  user: "10001:10001"
  environment:
    DESKTOP_PASSWORD_FILE: /run/secrets/desktop_password
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  svl-python-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.debian13
    container_name: svl-python-backend
    restart: unless-stopped
    environment:
      SVL_OPERATOR_TOKEN: "${SVL_OPERATOR_TOKEN:?Wymagany sekret SVL_OPERATOR_TOKEN o dlugosci min. 32 znakow}"
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_PREFERRED_MODEL: "${OLLAMA_PREFERRED_MODEL:-llama3.2-vision:11b}"
      COMFYUI_HOST: "http://comfyui:8188"
      SVL_SQLITE_PATH: "/var/lib/svl-os/svl_os.sqlite3"
      SVL_PYTHON_PORT: "8085"
    ports:
      - "127.0.0.1:8085:8085"
    volumes:
      - svl-os-data:/var/lib/svl-os
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8085/api/py/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      ollama:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  ollama:
    # Keep aligned with the installer: the newer runtime rejects this model's mllama architecture.
    image: ollama/ollama:0.24.0
    container_name: svl-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
      - "${SVL_AI_MODEL_DIR:-/opt/svl-ai-models}:/opt/svl-ai-models:ro"
    expose:
      - "11434"
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 5s
      retries: 5

  ollama-model-init:
    image: ollama/ollama:0.24.0
    container_name: svl-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      MODEL="${OLLAMA_PREFERRED_MODEL:-llama3.2-vision:11b}"
      if [ "$$MODEL" = "qwen3.8-27b-q5" ] && [ -f /opt/svl-ai-models/llm/Modelfile ]; then
        echo "[SVL Ollama Init] Importowanie lokalnego GGUF: $$MODEL"
        OLLAMA_HOST=http://ollama:11434 ollama create "$$MODEL" -f /opt/svl-ai-models/llm/Modelfile
      else
        echo "[SVL Ollama Init] Pobieranie skonfigurowanego modelu: $$MODEL"
        OLLAMA_HOST=http://ollama:11434 ollama pull "$$MODEL"
      fi
    environment:
      OLLAMA_PREFERRED_MODEL: "${OLLAMA_PREFERRED_MODEL:-llama3.2-vision:11b}"

  comfyui:
    profiles: ["image"]
    build:
      context: ./comfyui
    container_name: svl-comfyui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8188:8188"
    volumes:
      - "${COMFYUI_MODELS_PATH:-/opt/svl-comfyui/models}:/opt/ComfyUI/models"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8188/system_stats"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: svl-open-webui
    restart: unless-stopped
    depends_on:
      - ollama
      - svl-python-backend
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      OPENAI_API_BASE_URL: "http://svl-python-backend:8085/v1"
      WEBUI_NAME: "SVL Python OS (Debian 13 Trixie)"
      ENABLE_PERSISTENT_CONFIG: "true"
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open-webui-data:/app/backend/data

  svl-desktop-aria:
    <<: *agent-desktop
    container_name: svl-desktop-aria
    networks:
      - svl-desktop-aria-net
    ports:
      - "127.0.0.1:6081:6080"
    volumes:
      - svl-desktop-aria:/home/agent
    secrets:
      - source: desktop_aria_password
        target: desktop_password

  svl-desktop-alex:
    <<: *agent-desktop
    container_name: svl-desktop-alex
    networks:
      - svl-desktop-alex-net
    ports:
      - "127.0.0.1:6082:6080"
    volumes:
      - svl-desktop-alex:/home/agent
    secrets:
      - source: desktop_alex_password
        target: desktop_password

  svl-desktop-astyria:
    <<: *agent-desktop
    container_name: svl-desktop-astyria
    networks:
      - svl-desktop-astyria-net
    ports:
      - "127.0.0.1:6083:6080"
    volumes:
      - svl-desktop-astyria:/home/agent
    secrets:
      - source: desktop_astyria_password
        target: desktop_password

  svl-desktop-aurelius:
    <<: *agent-desktop
    container_name: svl-desktop-aurelius
    networks:
      - svl-desktop-aurelius-net
    ports:
      - "127.0.0.1:6084:6080"
    volumes:
      - svl-desktop-aurelius:/home/agent
    secrets:
      - source: desktop_aurelius_password
        target: desktop_password

  svl-desktop-agata:
    <<: *agent-desktop
    container_name: svl-desktop-agata
    networks:
      - svl-desktop-agata-net
    ports:
      - "127.0.0.1:6085:6080"
    volumes:
      - svl-desktop-agata:/home/agent
    secrets:
      - source: desktop_agata_password
        target: desktop_password

volumes:
  svl-os-data:
  ollama-models:
  open-webui-data:
  svl-desktop-aria:
  svl-desktop-alex:
  svl-desktop-astyria:
  svl-desktop-aurelius:
  svl-desktop-agata:

secrets:
  desktop_aria_password:
    file: ${SVL_DESKTOP_ARIA_PASSWORD_FILE:-/etc/svl-os/desktop-secrets/aria.password}
  desktop_alex_password:
    file: ${SVL_DESKTOP_ALEX_PASSWORD_FILE:-/etc/svl-os/desktop-secrets/alex.password}
  desktop_astyria_password:
    file: ${SVL_DESKTOP_ASTYRIA_PASSWORD_FILE:-/etc/svl-os/desktop-secrets/astyria.password}
  desktop_aurelius_password:
    file: ${SVL_DESKTOP_AURELIUS_PASSWORD_FILE:-/etc/svl-os/desktop-secrets/aurelius.password}
  desktop_agata_password:
    file: ${SVL_DESKTOP_AGATA_PASSWORD_FILE:-/etc/svl-os/desktop-secrets/agata.password}

networks:
  svl-desktop-aria-net:
    internal: true
  svl-desktop-alex-net:
    internal: true
  svl-desktop-astyria-net:
    internal: true
  svl-desktop-aurelius-net:
    internal: true
  svl-desktop-agata-net:
    internal: true
