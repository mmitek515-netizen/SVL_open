name: SVL Codex MCP smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'deploy/install-codex-mcp.sh'
      - 'deploy/start-codex-mcp-cli.sh'
      - 'deploy/diagnose-codex-mcp.sh'
      - 'deploy/systemd/svl-codex-mcp.service'
      - '.github/workflows/codex-mcp-check.yml'
  workflow_dispatch:
jobs:
  test-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check mcp/codex-bridge.mjs
          node --check mcp/codex-bridge.test.mjs
          bash -n deploy/install-codex-mcp.sh
          bash -n deploy/start-codex-mcp-cli.sh
          bash -n deploy/diagnose-codex-mcp.sh
      - name: Mock Codex CLI protocol smoke tests
        run: node --test mcp/codex-bridge.test.mjs
